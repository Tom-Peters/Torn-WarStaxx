name: WarStaxx syntax and integration
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Test installed userscript at 360px in Chrome
        run: |
          python -m pip install playwright==1.56.0
          python tests/browser/command_mobile.py
